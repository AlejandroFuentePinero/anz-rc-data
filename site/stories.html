<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap">
<link rel="stylesheet" href="site.css">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<header class="site">
<div class="in">
<p class="brand"><a href="index.html">ANZ Regional Championships</a></p>
<nav><a href="index.html">Overview</a><a href="leaderboard.html">Leaderboard</a><a href="stories.html" aria-current="page">Stories</a></nav>
<div class="search">
<input id="search" type="search" placeholder="Find a Player" autocomplete="off">
<ul id="search-results"></ul>
</div>
</div>
</header>
<main>
<h1>Stories</h1>
<!-- A new episode: its video and its cover (a JPEG about 540 by 960) into stories/, and its tile here, newest first.
     Each Player in it is a link to their card by slug, with their Display Name, separated by commas. -->
<ul class="stories">
<li><button type="button" class="story" data-video="stories/ep01-the-line.mp4">
<img src="stories/ep01-the-line.jpg" alt="" width="540" height="960">
<span class="episode">Episode 1</span><span class="title">The Line</span>
</button>
<p class="who"><a href="player.html#mcfish">Joel McAndrew</a></p></li>
</ul>
</main>
<dialog class="viewer" id="viewer">
<button type="button" class="close">Close</button>
<video controls playsinline preload="none"></video>
</dialog>
<footer class="site"><p><span>Contact: <a href="mailto:alejandrofuentepinero@gmail.com">alejandrofuentepinero@gmail.com</a></span> · <span>Discord: alejandrofp92</span> · <span>Ratings follow the <a href="https://mtgeloproject.net/">MTG Elo Project</a></span> · <span>Also by me: <a href="https://www.7phgraph.com/">7PH Graph</a></span></p></footer>
<script src="site.js"></script>
<script src="search.js"></script>
<script>
// A tile opens its episode over the page; Close, a click outside it or Esc stops it and goes back to the tiles.
const viewer = document.getElementById("viewer");
const video = viewer.querySelector("video");
for (const story of document.querySelectorAll(".story")) {
  story.addEventListener("click", () => {
    video.poster = story.querySelector("img").src;
    video.src = story.dataset.video;
    viewer.showModal();
    video.play();
  });
}
viewer.querySelector(".close").addEventListener("click", () => viewer.close());
// Outside the video and the button is the backdrop, which the browser counts as the dialog itself.
viewer.addEventListener("click", (event) => { if (event.target === viewer) viewer.close(); });
viewer.addEventListener("close", () => {
  video.pause();
  video.removeAttribute("src");
  video.load();
});
</script>
</body>
</html>
