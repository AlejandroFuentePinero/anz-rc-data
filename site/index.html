<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANZ Regional Championships</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; background: #fff; color: #222; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; }
  th, td { padding: 4px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid #ddd; white-space: nowrap; }
  td.num { text-align: right; }
  .formats { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .formats button { font: inherit; padding: 4px 12px; border: 1px solid #bbb; border-radius: 16px; background: #fff; cursor: pointer; }
  .formats button[aria-pressed="true"] { background: #222; color: #fff; border-color: #222; }
</style>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
</head>
<body>
<h1>ANZ Regional Championships</h1>
<input id="search" type="search" placeholder="Find a Player" autocomplete="off">
<ul id="search-results"></ul>
<div class="formats" id="formats"></div>

<h2>How big is each RC?</h2>
<div id="field-size"></div>

<h2>Who fills each RC?</h2>
<p>Across every RC. <span id="fill-story"></span></p>
<div id="experience"></div>

<h2>Does experience pay?</h2>
<p>Across every RC. <span id="pay-story"></span></p>
<div id="top-8-rate"></div>

<h2>Every RC</h2>
<p id="table-story"></p>
<div class="scroll">
<table>
  <thead><tr><th>Cycle</th><th>Date</th><th>City</th><th>Format</th><th>Field Size</th><th>Champion</th><th>Finalist</th></tr></thead>
  <tbody id="rcs"></tbody>
</table>
</div>
<script src="search.js"></script>
<script>
// Each level of experience runs light (new) to dark (8th+).
const FIELD_COLOUR = "#4a4a4a";
const LEVEL_COLOUR = ["#86b6ef", "#3987e5", "#1c5cab", "#0d366b"];
const config = { displayModeBar: false, responsive: true };
const margin = { t: 8, r: 16, l: 56, b: 40 };

function link(player) {
  const a = document.createElement("a");
  a.href = `player.html#${player.slug}`;
  a.textContent = player.name;
  return a;
}

Promise.all([fetch("data/rcs.json"), fetch("data/community.json")])
  .then((responses) => Promise.all(responses.map((response) => response.json())))
  .then(([rcs, community]) => {
    const cycles = rcs.map((rc) => rc.cycle);
    const formats = [...new Set(rcs.map((rc) => rc.format))];
    const rate = (row) => `${row.rate}% (${row.top_8s} of ${row.seats})`;
    const [first, , , veteran] = community.top_8_rate_by_experience;

    // Across every RC: the field by experience and the Top 8 rate at each level. The Format filter leaves these.
    document.getElementById("fill-story").textContent =
      `At a typical RC, ${community.typical_first_rc_share}% of the field is at their first RC (Cycle ${cycles[0]} aside, where everyone was).`;
    Plotly.newPlot("experience", community.levels.map((level, j) => ({
      type: "bar", name: `At their ${level} RC`,
      x: community.field_by_experience.map((rc) => rc.cycle),
      y: community.field_by_experience.map((rc) => rc.shares[j]),
      customdata: community.field_by_experience.map((rc) => rc.players[j]),
      marker: { color: LEVEL_COLOUR[j], line: { color: "#fff", width: 1 } },
      hovertemplate: `Cycle %{x}: %{customdata} Players at their ${level} RC (%{y}%)<extra></extra>`,
    })), {
      margin, height: 340, barmode: "stack", legend: { orientation: "h", y: -0.25, traceorder: "normal" },
      xaxis: { title: { text: "Cycle" }, tickvals: cycles }, yaxis: { title: { text: "Share of the field" }, ticksuffix: "%", range: [0, 100] },
    }, config);

    document.getElementById("pay-story").textContent =
      `Players at their 8th RC or later made the Top 8 ${veteran.rate}% of the time, against ${first.rate}% at their first. ` +
      "That shows who keeps coming back, strong Players among them, not that playing more makes anyone better. " +
      `Cycle ${cycles[0]} is left out, where everyone was at their first RC.`;
    const rates = community.top_8_rate_by_experience;
    Plotly.newPlot("top-8-rate", [{
      type: "bar", x: rates.map((row) => `At their ${row.level} RC`), y: rates.map((row) => row.rate),
      text: rates.map(rate), textposition: "outside", cliponaxis: false,
      marker: { color: LEVEL_COLOUR },
      hovertemplate: "%{x}: %{text}<extra></extra>",
    }], {
      margin, height: 300, showlegend: false,
      yaxis: { title: { text: "Top 8 rate" }, ticksuffix: "%", rangemode: "tozero" },
    }, config);

    document.getElementById("table-story").textContent =
      `Across every RC: ${rcs.length} RCs, ${community.champions} different champions, and the ${community.top_8_places} Top 8 places went to ${community.top_8_players} Players.`;

    // The Format filter: the Field Size plot and the RC table.
    let view = "Global";
    const buttons = document.getElementById("formats");
    for (const name of ["Global", ...formats]) {
      const button = document.createElement("button");
      button.textContent = name;
      button.addEventListener("click", () => { view = name; show(); });
      buttons.append(button);
    }

    function show() {
      for (const button of buttons.children) button.setAttribute("aria-pressed", button.textContent === view);
      const shown = rcs.filter((rc) => view === "Global" || rc.format === view);

      // Every RC stays on the plot; a chosen Format's RCs keep full strength and the others fade.
      Plotly.react("field-size", [{
        type: "bar", x: cycles, y: rcs.map((rc) => rc.field_size), customdata: rcs.map((rc) => rc.format),
        marker: { color: FIELD_COLOUR, opacity: rcs.map((rc) => (view === "Global" || rc.format === view ? 1 : 0.2)) },
        hovertemplate: "Cycle %{x}, %{customdata}: %{y} Players<extra></extra>",
      }], {
        margin, height: 300, showlegend: false, bargap: 0.25,
        xaxis: { title: { text: "Cycle" }, tickvals: cycles }, yaxis: { title: { text: "Field Size" }, rangemode: "tozero" },
      }, config);

      const body = document.getElementById("rcs");
      body.replaceChildren();
      for (const rc of shown) {
        const row = body.insertRow();
        const cells = [
          [rc.cycle, "num"], [rc.date], [rc.city ?? "-"], [rc.format], [rc.field_size, "num"],
          [link(rc.champion)], [link(rc.finalist)],
        ];
        for (const [value, cls] of cells) {
          const cell = row.insertCell();
          cell.append(value);
          if (cls) cell.className = cls;
        }
      }
    }

    show();
  });
</script>
</body>
</html>
