<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboard</title>
<!-- PROTOTYPE (#11): the chosen style's sheet, and the header's search behaviour. -->
<script src="prototype/style.js"></script>
</head>
<body>
<header class="site">
<div class="in">
<p class="brand"><a href="index.html">ANZ Regional Championships</a></p>
<nav><a href="index.html">Overview</a><a href="leaderboard.html" aria-current="page">Leaderboard</a></nav>
<div class="search">
<input id="search" type="search" placeholder="Find a Player" autocomplete="off">
<ul id="search-results"></ul>
</div>
</div>
</header>
<main class="leaderboard">
<h1>Leaderboard</h1>
<div class="formats" id="formats"></div>

<section class="panel">
<div class="scroll">
<table class="sortable">
  <thead><tr id="columns"></tr></thead>
  <tbody id="rows"></tbody>
</table>
</div>
<!-- The cutoff is ratings.CUTOFF in the build. -->
<p class="note">You must have played at least 3 RCs to be ranked, and 3 in a Format to be ranked in it. <span id="ranked"></span></p>
</section>
</main>
<script src="search.js"></script>
<script>
const VIEWS = ["Global", "Pioneer", "Standard", "Modern"];
// PROTOTYPE: how many Players are ranked in each view, counted from the cards; the build would publish these.
const RANKED = { Global: 301, Pioneer: 82, Standard: 109, Modern: 88 };
const TIERS = ["Winner", "Runner-up", "Top 4", "Top 8"];
// Best Finish in order: the Top 8 tiers, then the ordinals by rank.
const finishOrder = (finish) => (finish == null ? Infinity : TIERS.includes(finish) ? TIERS.indexOf(finish) : 8 + parseInt(finish, 10));

// Each column: its heading, how a row shows in it, the value it sorts on, and whether its first click sorts high first.
const COLUMNS = [
  { name: "Rank", show: (row) => row.rank, key: (row) => row.rank, num: true },
  { name: "Player", show: (row) => link(row), key: (row) => row.name.toLowerCase() },
  { name: "Rating", show: (row) => Math.round(row.rating), key: (row) => row.rating, num: true, high: true },
  { name: "Peak Rating", show: (row) => Math.round(row.peak), key: (row) => row.peak, num: true, high: true },
  { name: "W-L-D", show: (row) => row.record, key: (row) => parseInt(row.record, 10), high: true },
  { name: "Win rate", show: (row) => (row.win_rate.rate == null ? "-" : `${row.win_rate.rate}%`), key: (row) => row.win_rate.rate ?? -1, num: true, high: true },
  { name: "RCs", show: (row) => row.rcs, key: (row) => row.rcs, num: true, high: true },
  { name: "Top 8s", show: (row) => row.top_8s, key: (row) => row.top_8s, num: true, high: true },
  { name: "Finals", show: (row) => row.finals, key: (row) => row.finals, num: true, high: true },
  { name: "Best Finish", show: (row) => row.best_finish ?? "-", key: (row) => finishOrder(row.best_finish) },
  { name: "Last RC", show: (row) => row.last_rc, key: (row) => row.last_rc, num: true, high: true },
];

function link(row) {
  const a = document.createElement("a");
  a.href = `player.html#${row.slug}`;
  a.textContent = row.name;
  return a;
}

let boards = null;
let sort = { column: "Rank", high: false };

function show() {
  const views = VIEWS.filter((view) => view in boards);
  const asked = decodeURIComponent(location.hash.slice(1));
  const view = views.includes(asked) ? asked : "Global";
  const rows = boards[view];
  document.getElementById("ranked").textContent = `${RANKED[view]} Players are ranked in ${view === "Global" ? "All" : view}.`;
  document.title = view === "Global" ? "Leaderboard" : `${view} Leaderboard`;

  const formats = document.getElementById("formats");
  formats.replaceChildren(...views.map((name) => {
    const a = document.createElement("a");
    a.href = name === "Global" ? "#" : `#${name}`;
    a.textContent = name === "Global" ? "All" : name;  // every Format together reads as All
    a.setAttribute("aria-current", name === view);
    return a;
  }));

  const header = document.getElementById("columns");
  header.replaceChildren(...COLUMNS.map((column) => {
    const th = document.createElement("th");
    th.textContent = column.name;
    if (column.num) th.className = "num";
    if (column.name === sort.column) th.setAttribute("aria-sort", sort.high ? "descending" : "ascending");
    th.addEventListener("click", () => {
      sort = sort.column === column.name ? { column: column.name, high: !sort.high } : { column: column.name, high: !!column.high };
      show();
    });
    return th;
  }));

  // Ties keep the Leaderboard's own order, by rank.
  const by = COLUMNS.find((column) => column.name === sort.column).key;
  const sorted = [...rows].sort((a, b) => {
    const [x, y] = [by(a), by(b)];
    const order = x < y ? -1 : x > y ? 1 : 0;
    return (sort.high ? -order : order) || a.rank - b.rank;
  });
  const body = document.getElementById("rows");
  body.replaceChildren();
  for (const row of sorted) {
    const tr = body.insertRow();
    for (const column of COLUMNS) {
      const cell = tr.insertCell();
      cell.append(column.show(row));
      if (column.num) cell.className = "num";
    }
  }
}

fetch("data/leaderboard.json")
  .then((response) => response.json())
  .then((loaded) => {
    boards = loaded;
    window.addEventListener("hashchange", show);
    show();
  });
</script>
</body>
</html>
